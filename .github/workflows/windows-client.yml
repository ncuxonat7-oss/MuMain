name: Windows Client Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-bind-isolated:
    name: Isolated local bind helper/socket check
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/task/local-bind-isolated-check'
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: python {0}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'

    steps:
      - name: Initialize evidence
        run: |
          import json, os, subprocess
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f"DOTNET_INSTALL_DIR={temporary / 'local-bind-dotnet'}\n")
              env_file.write(f"NUGET_PACKAGES={temporary / 'local-bind-packages'}\n")
          evidence = Path(os.environ['RUNNER_TEMP']) / 'local-bind-evidence'
          evidence.mkdir()
          settings = {}
          for key in ('core.autocrlf', 'core.eol'):
              result = subprocess.run(['git', 'config', '--get', key], cwd=temporary,
                                      capture_output=True, text=True)
              if result.returncode not in (0, 1):
                  raise RuntimeError(f'Cannot inspect {key}: exit {result.returncode}')
              origin = subprocess.run(['git', 'config', '--show-origin', '--get', key],
                                      cwd=temporary, capture_output=True, text=True, check=False)
              if origin.returncode != result.returncode:
                  raise RuntimeError(f'Inconsistent configuration read: {key}')
              settings[key] = {'value': result.stdout.strip() if result.returncode == 0 else None,
                               'origin': origin.stdout.strip()}
          (evidence / 'original-git-settings.json').write_text(
              json.dumps(settings, indent=2), encoding='utf-8')
          (evidence / 'scope.txt').write_text(
              'Isolated helper/socket check only; 12 existing checks.\n'
              'Not production OpenMU integration, Windows package, or persistence proof.\n'
              f"Workflow commit: {os.environ['GITHUB_SHA']}\n"
              'SDK requested: 10.0.109\n', encoding='utf-8')

      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/windows-client.yml
            /patches/openmu-local-only-bind-provenance.json
            /patches/openmu-local-only-bind.patch
            /patches/openmu-trade-money.patch
            /scripts/check-local-bind-source.py
            /tests/network/local_only_bind/LocalOnlyBind.csproj
            /tests/network/local_only_bind/Program.cs

      - name: Verify pinned sources and apply bind patch in isolation
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        run: |
          import contextlib, hashlib, json, os, subprocess, sys, tempfile, traceback
          import urllib.request
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'local-bind-check'
          review = root / 'review'
          source = root / 'openmu'
          evidence = Path(os.environ['RUNNER_TEMP']) / 'local-bind-evidence'
          paths = [
              'patches/openmu-local-only-bind-provenance.json',
              'patches/openmu-local-only-bind.patch',
              'patches/openmu-trade-money.patch',
              'scripts/check-local-bind-source.py',
              'tests/network/local_only_bind/LocalOnlyBind.csproj',
              'tests/network/local_only_bind/Program.cs',
          ]
          with (evidence / 'source-check.txt').open('w', encoding='utf-8') as log:
              with contextlib.redirect_stdout(log), contextlib.redirect_stderr(log):
                  try:
                      for name in paths:
                          data = subprocess.check_output(['git', 'show', f'HEAD:{name}'])
                          target = review / name
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_bytes(data)
                          print('Review SHA256', hashlib.sha256(data).hexdigest(), name)
                      provenance = json.loads((review / paths[0]).read_text())
                      pin = 'd067b3c11c23c3145de6e2c76201ab9a93b267c8'
                      assert provenance['repository'] == 'https://github.com/MUnique/OpenMU'
                      assert provenance['commit'] == pin
                      assert len(provenance['sourceSha256']) == 7
                      for name, expected in provenance['sourceSha256'].items():
                          assert not Path(name).is_absolute() and '..' not in Path(name).parts
                          url = f'https://raw.githubusercontent.com/MUnique/OpenMU/{pin}/{name}'
                          print('GET', url, flush=True)
                          with urllib.request.urlopen(url, timeout=30) as response:
                              data = response.read()
                          actual = hashlib.sha256(data).hexdigest()
                          assert actual == expected, f'Source hash mismatch: {name}'
                          target = source / name
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_bytes(data)
                          print('Source SHA256', actual, name, flush=True)
                      original = (source / 'src/Network/Listener.cs').read_bytes()
                      expected = original.replace(
                          b'new TcpListener(IPAddress.Any, this._port)',
                          b'new TcpListener(LocalOnlyBinding.GetAddress(), this._port)')
                      def describe(label, data):
                          print(label, json.dumps({
                              'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(),
                              'LF_total': data.count(b'\n'), 'CRLF': data.count(b'\r\n'),
                              'LF_only': data.count(b'\n') - data.count(b'\r\n'),
                              'CR_only': data.count(b'\r') - data.count(b'\r\n'),
                              'UTF8_BOM': data.startswith(b'\xef\xbb\xbf')
                          }), flush=True)
                      describe('original', original)
                      describe('expected', expected)
                      settings = json.loads((evidence / 'original-git-settings.json').read_text())
                      print('Original Git settings:', json.dumps(settings), flush=True)
                      control_git = ['git']
                      for key, default in (('core.autocrlf', 'false'), ('core.eol', 'native')):
                          value = settings[key]['value']
                          control_git.extend(['-c', key + '=' + (default if value is None else value)])
                      with tempfile.TemporaryDirectory() as control:
                          control = Path(control)
                          listener = control / 'src/Network/Listener.cs'
                          listener.parent.mkdir(parents=True)
                          listener.write_bytes(original)
                          subprocess.run(['git', 'init', '-q', str(control)],
                                         check=True, stdout=log, stderr=log)
                          result = subprocess.run(
                              control_git + ['apply', str(review / paths[1])],
                              cwd=control, stdout=log, stderr=log, check=False)
                          print('Control apply exit:', result.returncode, flush=True)
                          actual = listener.read_bytes()
                          describe('control actual', actual)
                          print('Control exact expected match:', actual == expected, flush=True)
                      print('Strict Git settings: core.autocrlf=false; core.eol=lf', flush=True)
                      subprocess.run(
                          [sys.executable, str(review / paths[3]), str(source)],
                          check=True, stdout=log, stderr=log)
                      patch = str(review / paths[1])
                      subprocess.run(['git', 'init', '-q', str(source)], check=True,
                                     stdout=log, stderr=log)
                      subprocess.run(['git', 'apply', '--check', patch], cwd=source,
                                     check=True, stdout=log, stderr=log)
                      subprocess.run(['git', 'apply', patch], cwd=source,
                                     check=True, stdout=log, stderr=log)
                      actual = (source / 'src/Network/Listener.cs').read_bytes()
                      describe('strict actual', actual)
                      assert actual == expected, 'Isolated source differs from exact expected bytes'
                      print('PASS: source checker and isolated bind patch application.', flush=True)
                  except BaseException:
                      traceback.print_exc()
                      raise

      - name: Setup pinned official .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.109'

      - name: Run existing helper/socket test
        run: |
          import contextlib, json, os, subprocess, traceback
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'local-bind-check'
          project = root / 'review/tests/network/local_only_bind'
          evidence = Path(os.environ['RUNNER_TEMP']) / 'local-bind-evidence'
          (project / 'global.json').write_text(json.dumps({
              'sdk': {'version': '10.0.109', 'rollForward': 'disable', 'allowPrerelease': False}
          }), encoding='utf-8')
          config = project / 'NuGet.Config'
          config.write_text('<configuration><packageSources><clear /></packageSources></configuration>',
                            encoding='utf-8')
          source_arg = '-p:OpenMuSource=' + (root / 'openmu').as_posix()
          with (evidence / 'helper-socket.txt').open('w', encoding='utf-8') as log:
              with contextlib.redirect_stdout(log), contextlib.redirect_stderr(log):
                  try:
                      version = subprocess.check_output(['dotnet', '--version'], cwd=project,
                                                        text=True, stderr=log).strip()
                      print('Selected SDK:', version, flush=True)
                      assert version == '10.0.109', 'Unexpected SDK selection'
                      commands = [
                          ['dotnet', '--info'],
                          ['dotnet', 'restore', 'LocalOnlyBind.csproj', '--configfile', str(config),
                           '-p:NuGetAudit=false', source_arg],
                          ['dotnet', 'run', '--project', 'LocalOnlyBind.csproj',
                           '--configuration', 'Release', '--no-restore', source_arg],
                      ]
                      for command in commands:
                          print('COMMAND', json.dumps(command), flush=True)
                          subprocess.run(command, cwd=project, check=True, stdout=log, stderr=log)
                      print('PASS: all 12 existing helper/socket checks completed.', flush=True)
                  except BaseException:
                      traceback.print_exc()
                      raise

      - name: Record job status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          import os
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP']) / 'local-bind-evidence'
          evidence.mkdir(exist_ok=True)
          (evidence / 'status.txt').write_text(
              'Job status before upload: ' + os.environ['JOB_STATUS'] + '\n'
              'Missing test PASS means NOT_PROVEN; inspect step logs.\n', encoding='utf-8')

      - name: Upload short evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-bind-isolated-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/local-bind-evidence/*.txt
            ${{ runner.temp }}/local-bind-evidence/original-git-settings.json
          if-no-files-found: error
          retention-days: 7
