name: Windows Client Build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  server-smoke:
    name: Pinned server build and one local STR persistence smoke
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/task/local-bind-isolated-check'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare directories and validate PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory evidence,private-logs,downloads | Out-Null
          $errors = $null; $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/local-bind-server-smoke.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          "DOTNET_INSTALL_DIR=$env:RUNNER_TEMP/local-bind-dotnet" >> $env:GITHUB_ENV
          "NUGET_PACKAGES=$env:RUNNER_TEMP/local-bind-nuget" >> $env:GITHUB_ENV
          'NOT_RUN: build and integration pending' | Set-Content evidence/result.txt
      - name: Fetch exact approved DB and ready client archives
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const specs = [
              [11651520969, 38005996341, 'baseline-data-final', 'database.zip', 'b40fbdbdb5c3bd9630331e0b9cb3bc7c1860db041a928bb976555635e03f79ea'],
              [11567737809, 37813650810, 'mu-client-windows-native-x64-release-editor-off-no-data-main', 'client.zip', 'eefe0a710518bc6536dd47cde45fb8605ae4ef5c7f4faca4095e8abb5f23297e']
            ];
            const evidence = [];
            for (const [id, run, name, file, sha256] of specs) {
              const {data: meta} = await github.rest.actions.getArtifact({...context.repo, artifact_id:id});
              if (meta.expired || meta.name !== name || meta.workflow_run.id !== run) throw new Error('Artifact identity unavailable: ' + id);
              const {data} = await github.rest.actions.downloadArtifact({...context.repo, artifact_id:id, archive_format:'zip'});
              const bytes = Buffer.from(data);
              if (crypto.createHash('sha256').update(bytes).digest('hex') !== sha256) throw new Error('Artifact hash mismatch: ' + id);
              fs.writeFileSync('downloads/' + file, bytes);
              evidence.push({id, run, name, sha256, bytes:bytes.length});
            }
            fs.writeFileSync('evidence/input-artifacts.json', JSON.stringify(evidence, null, 2));
      - name: Stage verified client and disposable DB input
        shell: pwsh
        run: |
          python scripts/prepare-local-bind-smoke.py inputs
          if ($LASTEXITCODE) { throw 'Input staging failed' }
      - name: Checkout exact server source with LF bytes
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          repository: MUnique/OpenMU
          ref: d067b3c11c23c3145de6e2c76201ab9a93b267c8
          path: server-source
          persist-credentials: false
      - name: Verify and apply both existing patches
        shell: pwsh
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        run: |
          python scripts/prepare-local-bind-smoke.py source
          if ($LASTEXITCODE) { throw 'Pinned source or patch verification failed' }
      - name: Setup confirmed SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.109'
      - name: Build only server Startup and preserve clean runtime
        timeout-minutes: 18
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location server-source
          try {
            if ((dotnet --version).Trim() -ne '10.0.109') { throw 'Unexpected SDK' }
            dotnet --info > ../evidence/sdk.txt
            dotnet build src/Startup/MUnique.OpenMU.Startup.csproj -c Release -p:ci=true > ../private-logs/build.txt 2>&1
            if ($LASTEXITCODE) { throw 'Server build failed; inspect bounded build evidence' }
          } finally { Pop-Location }
          python scripts/prepare-local-bind-smoke.py runtime
          if ($LASTEXITCODE) { throw 'Runtime provenance failed' }
      - name: Save newly built runtime before any server launch
        uses: actions/upload-artifact@v4
        with:
          name: openmu-money-local-bind-${{ github.run_id }}
          path: |
            downloads/openmu-money-local-bind-runtime.zip
            evidence/runtime-manifest.json
            evidence/runtime-archive.json
            evidence/source-provenance.json
          retention-days: 30
          if-no-files-found: error
      - name: One guarded STR persistence check; native relog needs visual review
        timeout-minutes: 12
        shell: pwsh
        run: ./scripts/local-bind-server-smoke.ps1
      - name: Finalize bounded evidence
        if: always()
        shell: pwsh
        env:
          SMOKE_JOB_STATUS: ${{ job.status }}
        run: |
          python scripts/prepare-local-bind-smoke.py evidence
          if ($LASTEXITCODE) { throw 'Evidence finalization failed' }
      - name: Preserve evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-bind-server-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
